[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_flags =
    --before=no_reset
    --after=hard_reset
lib_deps =
    https://github.com/tzapu/WiFiManager.git
build_flags =
    -DCORE_DEBUG_LEVEL=0

; WiFi OTA 업로드용 — pio run -e ota -t upload
[env:ota]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = https://github.com/tzapu/WiFiManager.git
build_flags = -DCORE_DEBUG_LEVEL=0
upload_protocol = espota
upload_port = imazu-mitm.local
